server:
  port: 8080

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    br.gov.saude.hemogram: INFO
    org.springframework.web: WARN
  file:
    name: /app/logs/hemogram-monitoring.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized