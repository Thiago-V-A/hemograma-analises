version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: hemogram-db
    environment:
      POSTGRES_DB: hemogram_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hemogram-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemogram-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hemogram_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      FHIR_SERVER_URL: ${FHIR_SERVER_URL:-http://hapi.fhir.org/baseR4}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      ANALYTICS_WINDOW_HOURS: ${ANALYTICS_WINDOW_HOURS:-24}
      ANALYTICS_INTERVAL: ${ANALYTICS_INTERVAL:-15}
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    networks:
      - hemogram-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: hemogram-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - hemogram-network

  grafana:
    image: grafana/grafana:latest
    container_name: hemogram-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - hemogram-network

networks:
  hemogram-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

